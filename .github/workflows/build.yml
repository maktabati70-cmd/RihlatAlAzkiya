name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk DarAlWahyKids.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RihlatAlAzkiya-APK
          path: DarAlWahyKids.apk
      # نشر ملف APK كإصدار على GitHub ليتمكن التطبيق من اكتشاف التحديث
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          NAME=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          if gh release view "v$CODE" >/dev/null 2>&1; then
            gh release upload "v$CODE" DarAlWahyKids.apk --clobber
          else
            gh release create "v$CODE" DarAlWahyKids.apk --title "الإصدار $NAME" --notes "لعبة أطفال دار الوحي — الإصدار $NAME" --latest
          fi
