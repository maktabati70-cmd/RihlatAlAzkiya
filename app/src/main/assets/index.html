<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لعبة أطفال دار الوحي</title>
<style>
:root{--bg1:#1b1f5e;--bg2:#3a1c71;--card:#ffffff;--ink:#1d1d3a;--gold:#ffc83d;--ok:#22c55e;--bad:#ef4444;--acc:#7c5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#fff;overflow:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
button{font-family:inherit;border:0;cursor:pointer}
.bigbtn{background:linear-gradient(180deg,#ffd75e,#ffb31a);color:#4a2b00;font-size:22px;font-weight:800;padding:16px 30px;border-radius:22px;box-shadow:0 6px 0 #c77f00,0 10px 20px #0005;transition:transform .1s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #c77f00}
.bigbtn.alt{background:linear-gradient(180deg,#8f7bff,#6246ea);color:#fff;box-shadow:0 6px 0 #3d26b5,0 10px 20px #0005}
.bigbtn.green{background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff;box-shadow:0 6px 0 #0f7a36,0 10px 20px #0005}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.pill{background:#0004;border-radius:30px;padding:8px 14px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.iconbtn{background:#ffffff22;color:#fff;width:44px;height:44px;border-radius:14px;font-size:22px}
/* stars bg */
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.6;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.1}}
/* home */
#home{align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px}
.logo{font-size:84px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px #0006)}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
h1.title{margin:0;font-size:44px;font-weight:900;background:linear-gradient(90deg,#ffe27a,#ffb3e6,#8be9ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.sub{opacity:.85;font-size:17px;margin-top:-8px}
.homestats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.credit{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:14px;opacity:.8}
/* map: طريق متعرّج */
#map .topbar{position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(#0008,#0000)}
#map .scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:auto}
.road{position:relative;width:100%}
.zone{position:absolute;left:0;right:0}
.zone .zname{position:absolute;bottom:14px;left:10px;background:#0006;padding:6px 12px;border-radius:14px;font-weight:800;font-size:15px;z-index:2}
.zone .zname small{opacity:.8;font-weight:600;margin-right:6px}
.deco{position:absolute;font-size:30px;opacity:.9;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 3px 3px #0004)}
.deco.big{font-size:44px}
.deco.sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:translate(-50%,-50%) rotate(6deg) translateY(-4px)}}
svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#fff;color:var(--ink);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0004,0 0 0 5px #ffffff55;z-index:3}
.node .st{position:absolute;bottom:-17px;font-size:13px;color:#ffd23d;text-shadow:0 1px 2px #000;white-space:nowrap;letter-spacing:-1px}
.node.locked{background:#3b3b5a;color:#9a9ab8;box-shadow:0 5px 0 #0005}
.node.challenge{background:radial-gradient(#fff3b0,#ffb21f);width:66px;height:66px}
.node.mission{background:radial-gradient(#d9fbe3,#4ade80)}
.node.locked.challenge,.node.locked.mission{background:#4a4a66}
.node .tag{position:absolute;top:-10px;left:-8px;font-size:18px}
.node.current{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #0004,0 0 0 12px #ffffff33}}
.flag{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:900;font-size:18px;z-index:3;text-shadow:0 2px 4px #000}
.flag b{display:block;font-size:56px;animation:bob 2.4s ease-in-out infinite}
#avatar{position:absolute;font-size:44px;transform:translate(-50%,-110%);z-index:4;transition:left .45s ease-in-out,top .45s ease-in-out;filter:drop-shadow(0 4px 4px #0006);pointer-events:none}
#avatar span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
/* المشهد فوق السؤال */
.stage{position:relative;height:clamp(170px,30vh,270px);border-radius:26px;overflow:hidden;box-shadow:0 10px 26px #0005;flex-shrink:0}
.stage .badge{position:absolute;top:10px;right:10px;background:#000a;color:#fff;padding:5px 12px;border-radius:14px;font-weight:800;font-size:14px;z-index:2}
.stage .badge.num{right:auto;left:10px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage .pic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:76px;display:flex;gap:6px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 8px #0005);white-space:nowrap}
.stage .pic.math{font-size:44px;font-weight:900;color:#fff;font-family:"Comic Sans MS","Segoe UI",sans-serif;direction:ltr;text-shadow:0 3px 0 #0003}
@keyframes float{50%{transform:translate(-50%,-58%)}}
.stage.happy .pic{animation:happy .6s}
@keyframes happy{40%{transform:translate(-50%,-75%) scale(1.25) rotate(-8deg)}}
.stage.sad .pic{animation:sad .5s}
@keyframes sad{25%{transform:translate(-40%,-50%)}75%{transform:translate(-60%,-50%)}}
.cloud{animation:drift 18s linear infinite}
.cloud.c2{animation-duration:26s;animation-delay:-9s}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(460px)}}
.twk{animation:tw 2s infinite}
.spin{transform-origin:center;transform-box:fill-box;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-20px)}}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;left:50%;top:50%;font-style:normal;font-size:24px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
/* quiz */
#quiz{padding-bottom:12px}
.progress{height:12px;background:#0004;border-radius:10px;margin:0 16px;overflow:hidden}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#a3e635);border-radius:10px;transition:width .4s}
.qwrap{flex:1;display:flex;flex-direction:column;padding:12px 16px;gap:12px;overflow-y:auto}
.cat{align-self:center;background:#ffffff26;padding:6px 16px;border-radius:20px;font-weight:700;font-size:15px}
.qcard{background:var(--card);color:var(--ink);border-radius:22px;padding:14px 16px;font-size:21px;font-weight:800;text-align:center;line-height:1.55;box-shadow:0 8px 0 #0002,0 12px 24px #0004;min-height:76px;margin-top:-34px;position:relative;z-index:2;margin-inline:8px;display:flex;align-items:center;justify-content:center;animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#fff;color:var(--ink);font-size:18px;font-weight:800;padding:12px 8px;border-radius:18px;box-shadow:0 6px 0 #c9c3ff;min-height:62px;line-height:1.4;transition:transform .1s,background .2s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 6px 0 #15803d;animation:jump .4s}
.opt.bad{background:var(--bad);color:#fff;box-shadow:0 6px 0 #991b1b;animation:shake .4s}
.opt.gone{visibility:hidden}
@keyframes jump{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.helpers{display:flex;gap:10px;justify-content:center}
.helper{background:#ffffff22;color:#fff;font-weight:800;font-size:15px;padding:10px 14px;border-radius:16px}
.helper:disabled{opacity:.35}
.timer{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,100%),#0004 0);display:flex;align-items:center;justify-content:center;font-weight:900}
.timer span{background:var(--bg2);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* result */
#result{align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px}
.bigstars{font-size:64px;display:flex;gap:10px}
.bigstars span{opacity:.2;transform:scale(.5);transition:all .4s cubic-bezier(.3,1.8,.5,1)}
.bigstars span.on{opacity:1;transform:scale(1)}
.rescard{background:#ffffff1c;border-radius:24px;padding:18px 26px;font-size:19px;line-height:2}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.box{background:#fff;color:var(--ink);border-radius:28px;padding:24px 20px;max-width:420px;width:100%;text-align:center;animation:pop .3s}
.box h2{margin:0 0 10px}
.box p{font-size:18px;line-height:1.7}
.box .row{margin-top:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #eee;font-size:18px;font-weight:700}
.toggle{width:60px;height:34px;border-radius:20px;background:#ccc;position:relative}
.toggle.on{background:var(--ok)}
.toggle::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on::after{right:30px}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:16px;margin-top:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:14px;font-weight:700;z-index:70;display:none}

/* ===== إضافات النسخة 2 ===== */
#home{justify-content:flex-start;padding-top:max(26px,5vh);overflow-y:auto}
.hAv{cursor:pointer;animation:bob 2.4s ease-in-out infinite;margin-top:10px;filter:drop-shadow(0 8px 12px #0006)}
.hello{font-size:30px;font-weight:900;margin:0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
.menu .bigbtn{font-size:17px;padding:13px 8px;border-radius:18px}
.menu .wide{grid-column:1/-1;font-size:24px;padding:18px}
.bigbtn.daily{background:linear-gradient(180deg,#fb923c,#ea580c);color:#fff;box-shadow:0 6px 0 #9a3412,0 10px 20px #0005}
.bigbtn.daily.done{background:linear-gradient(180deg,#86efac,#22c55e);box-shadow:0 6px 0 #15803d}
.bigbtn small{font-size:14px}
.credit{position:static;margin-top:auto;padding:14px 0 6px}
.qcard{white-space:pre-line}
.opts.two{grid-template-columns:1fr 1fr}.opts.two .opt{font-size:22px;min-height:70px}
.opts.emo .opt{font-size:44px;min-height:84px}
.stage .speak{position:absolute;bottom:40px;right:10px;width:42px;height:42px;border-radius:50%;background:#fff;font-size:20px;box-shadow:0 3px 8px #0005;z-index:3}
.boss{position:absolute;left:12px;bottom:40px;text-align:center;z-index:2}
.boss .bem{font-size:58px;line-height:1;animation:bossIdle 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 6px #0007)}
.boss .hp{font-size:13px;background:#0008;border-radius:10px;padding:2px 6px;margin-top:2px}
@keyframes bossIdle{50%{transform:scale(1.08) rotate(4deg)}}
.boss.hit .bem{animation:bossHit .5s}
@keyframes bossHit{30%{transform:translateX(-14px) rotate(-15deg) scale(.85);filter:brightness(3)}}
.boss.laugh .bem{animation:bossLaugh .6s}
@keyframes bossLaugh{25%,75%{transform:translateY(-10px) scale(1.15)}50%{transform:translateY(0)}}
#explain{display:none;background:#fff;color:var(--ink);border-radius:20px;padding:12px 14px;box-shadow:0 8px 20px #0004;animation:pop .3s}
#explain.on{display:block}
.exh{font-weight:900;font-size:18px}.exh.good{color:#16a34a}.exh.oops{color:#dc2626}
.ext{font-size:16px;line-height:1.7;margin-top:4px}
#explain .helper{background:#ede9fe;color:#5b21b6}
/* رتّب الحروف */
.letters{display:flex;flex-direction:column;gap:14px;align-items:center}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:58px;border-radius:14px;background:#ffffff22;border:3px dashed #ffffff88;color:#fff;font-size:30px;font-weight:900}
.slot.ok{background:var(--ok);border-color:var(--ok)}.slot.bad{background:var(--bad);border-color:var(--bad)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:56px;height:60px;border-radius:16px;background:#fff;color:var(--ink);font-size:30px;font-weight:900;box-shadow:0 5px 0 #c9c3ff;transition:transform .15s}
.tile.used{opacity:.15;transform:scale(.8)}
.wordok{font-size:34px;font-weight:900;color:#bbf7d0}
.shake{animation:shake .4s}
/* اسحب وطابق */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:10px}
.chip,.target{border-radius:16px;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;padding:6px}
.chip{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9c3ff;touch-action:none;cursor:grab;font-size:32px}
.chip.sel{outline:4px solid var(--gold)}.chip.lift{opacity:.3}.chip.done{visibility:hidden}
.target{background:#ffffff1f;border:3px dashed #ffffffaa;color:#fff}
.target.done{background:var(--ok);border-color:var(--ok)}
.ghost{position:fixed;transform:translate(-50%,-50%) scale(1.1);z-index:99;pointer-events:none;width:110px}
/* نوافذ وأدوات */
.box{max-height:88vh;overflow-y:auto}
.inp{width:100%;font-family:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid #ddd6fe;margin-top:6px;text-align:right;user-select:text}
.inp.ok{border-color:#86efac}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{background:#ede9fe;color:#4c1d95;font-weight:800;padding:8px 12px;border-radius:12px;font-size:15px}
.tabs button.on{background:#7c3aed;color:#fff}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.items.small{grid-template-columns:repeat(5,1fr)}
.item{background:#f5f3ff;border-radius:16px;padding:10px 4px;border:3px solid transparent;color:var(--ink);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.item.on{border-color:#22c55e;background:#dcfce7}
.item .ic{font-size:38px;line-height:1.1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.items.small .ic{font-size:30px}
.item .pr{font-size:13px;font-weight:800}
.item .sw{display:block;width:46px;height:20px;border-radius:10px}
.item small{font-size:11px;opacity:.75}
.item.badge.off{opacity:.45}.item.badge b{font-size:13px}
.mini{display:flex;justify-content:center;margin-top:20px}
.pinshow{font-size:34px;letter-spacing:10px;margin:6px 0 10px;font-weight:900;color:#7c3aed}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:auto}
.pinpad button{font-size:26px;font-weight:900;padding:14px;border-radius:16px;background:#ede9fe;color:#4c1d95}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpis div{background:#f5f3ff;border-radius:14px;padding:8px 2px}.kpis b{display:block;font-size:24px;color:#7c3aed}.kpis small{font-size:12px}
.bar{display:grid;grid-template-columns:118px 1fr 44px 44px;align-items:center;gap:6px;font-size:13px;margin:6px 0;text-align:right}
.bar div{height:14px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafc;border-radius:12px;padding:8px 10px;margin:6px 0;text-align:right;font-size:15px}
.li button{background:#ede9fe;border-radius:10px;padding:8px 10px;font-size:18px}
.chest{font-size:110px;cursor:pointer;animation:bob 1.6s ease-in-out infinite;margin:6px 0}
.shakebig{animation:shakebig .9s!important}
@keyframes shakebig{10%,30%,50%,70%,90%{transform:rotate(-12deg) scale(1.1)}20%,40%,60%,80%{transform:rotate(12deg) scale(1.15)}}
.badgebig{font-size:96px;animation:pop .5s,bob 2s 1s ease-in-out infinite}
#rAvatar{font-size:64px}

/* ===== مريم وسلمى ===== */
#qText{display:none}
.stage{height:clamp(260px,42vh,360px)}
.stage .bubble{position:absolute;top:38px;left:10px;right:10px;background:#fff;color:var(--ink);border-radius:20px;padding:10px 14px;font-size:18px;font-weight:800;line-height:1.55;text-align:center;box-shadow:0 6px 14px #0004;z-index:3;max-height:42%;overflow-y:auto;animation:pop .35s}
.stage .bubble b{color:#be185d;font-size:15px}
.stage .bubble.from-s b{color:#0369a1}
.stage .bubble::after{content:"";position:absolute;bottom:-14px;border:9px solid transparent;border-top:14px solid #fff}
.stage .bubble.from-m::after{left:22%}.stage .bubble.from-s::after{right:22%}
.stage .girl{position:absolute;bottom:-4px;width:36%;max-width:170px;z-index:2;filter:drop-shadow(0 6px 8px #0005)}
.stage .g-m{left:2px}.stage .g-s{right:2px}.stage .g-s .gsvg{transform:scaleX(-1)}
.stage .girl .gsvg{display:block;position:relative;inset:auto;width:100%;height:auto}
.stage .gname{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px}
.stage .g-m .gname{background:#be185d}.stage .g-s .gname{background:#0369a1}
.stage .pic{top:auto;bottom:16%;font-size:44px;z-index:1}
.stage .boss{left:50%;transform:translateX(-50%);bottom:12%;z-index:1}
.stage .speak{bottom:auto;top:6px;right:auto;left:calc(50% - 21px);width:34px;height:34px;font-size:16px}
.stage .react{position:absolute;bottom:44%;background:#fff;color:var(--ink);border-radius:14px;padding:4px 10px;font-size:14px;font-weight:800;z-index:3;box-shadow:0 3px 8px #0004;animation:pop .3s;white-space:nowrap}
#react_m{left:8%}#react_s{right:8%}
.stage .react.big{font-size:15px;background:#fef9c3}
.talk{transform-box:fill-box;transform-origin:center;animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.1)}}
.gsvg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.stage.happy .girl{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-12px)}}
/* الرئيسية */
.hAv{display:flex;align-items:flex-end;justify-content:center;gap:4px;animation:none}
.hAv .hg{width:118px}.hAv .hg.flip .gsvg{transform:scaleX(-1)}
.hAv .hg .gsvg{animation:bob 2.6s ease-in-out infinite}.hAv .hg.flip .gsvg{animation:bobf 2.6s ease-in-out .6s infinite}
@keyframes bobf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-10px)}}
.hAv .hme{margin-bottom:18px;animation:bob 2.4s ease-in-out infinite}
.hsub{font-size:15px;opacity:.85;margin-top:-6px;background:#ffffff1f;padding:4px 14px;border-radius:14px}
.gradeflag{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#4c1d95;font-weight:900;font-size:14px;padding:6px 10px;border-radius:12px;box-shadow:0 4px 10px #0005;z-index:3;white-space:nowrap}

</style>
</head>
<body>
<div class="sky" id="sky"></div>

<!-- الرئيسية -->
<section class="screen on" id="home">
  <div class="hAv" id="hAvatar" onclick="openProfile()"></div>
  <div class="hsub">لعبة أطفال دار الوحي</div>
  <h1 class="hello" id="hHello">أطفال دار الوحي</h1>
  <div class="homestats">
    <div class="pill">⭐ <span id="hStars">0</span>/300</div>
    <div class="pill">🪙 <span id="hCoins">0</span></div>
    <div class="pill">🏁 <span id="hLevel">1</span>/100</div>
  </div>
  <div class="menu">

// ====== مولّد الحساب (مع الشرح) ======
function mathQ(n,r){
 const t=Math.ceil(n/20);let q,a,sp=10,info;
 if(t===1){ if(r()<.5){const x=ri(r,12,60+n*4),y=ri(r,8,40+n*3);q=`${L}${x} + ${y} = ?${R}`;a=x+y;info=`${L}${x} + ${y} = ${a}${R}`}
            else{const x=ri(r,40,90+n*5),y=ri(r,8,x-5);q=`${L}${x} − ${y} = ?${R}`;a=x-y;info=`${L}${x} − ${y} = ${a}${R}، وللتأكد: ${L}${a} + ${y} = ${x}${R}`} }
 else if(t===2){const x=ri(r,3,12),y=ri(r,3,12);q=`${L}${x} × ${y} = ?${R}`;a=x*y;sp=8;info=`${L}${x} × ${y}${R} يعني ${x} مكررة ${y} مرات = ${a}`}
 else if(t===3){ if(r()<.5){const y=ri(r,3,12),a0=ri(r,3,15);q=`${L}${a0*y} ÷ ${y} = ?${R}`;a=a0;sp=5;info=`لأن ${L}${a0} × ${y} = ${a0*y}${R}`}
            else{const x=ri(r,3,12),y=ri(r,3,9),c=ri(r,5,40);q=`${L}${x} × ${y} + ${c} = ?${R}`;a=x*y+c;info=`نضرب أولًا: ${L}${x} × ${y} = ${x*y}${R}، ثم نجمع: ${L}${x*y} + ${c} = ${a}${R}`} }
 else if(t===4){ const k=r();
   if(k<.4){const x=ri(r,2,20),y=ri(r,2,9),z=ri(r,2,9);q=`${L}${x} + ${y} × ${z} = ?${R}`;a=x+y*z;info=`الضرب قبل الجمع: ${L}${y} × ${z} = ${y*z}${R}، ثم ${L}${x} + ${y*z} = ${a}${R}`}
   else if(k<.75){const p=[10,20,25,50][ri(r,0,3)];const base=ri(r,2,12)*(p===25?4:p===50?2:10);q=`كم يساوي ${p}٪ من ${base}؟`;a=base*p/100;info=`${p}٪ تعني ${p} من كل 100: ${L}${base} × ${p} ÷ 100 = ${a}${R}`}
   else{const x=ri(r,11,25),y=ri(r,3,9);q=`${L}${x} × ${y} = ?${R}`;a=x*y;sp=12;info=`${L}${x} × ${y} = (${Math.floor(x/10)*10} × ${y}) + (${x%10} × ${y}) = ${a}${R}`} }
 else { const k=r();
   if(k<.25){const x=ri(r,6,15);q=`كم يساوي ${L}${x} × ${x}${R} ؟`;a=x*x;sp=15;info=`مربّع العدد ${x} هو ${a}`}
   else if(k<.5){const w=ri(r,4,15),h=ri(r,3,12);q=`مستطيل طوله ${w} سم وعرضه ${h} سم، كم مساحته (سم²)؟`;a=w*h;sp=12;info=`مساحة المستطيل = الطول × العرض = ${L}${w} × ${h} = ${a}${R}`}
   else if(k<.75){const d=[3,4,5][ri(r,0,2)],nu=ri(r,1,d-1),m=ri(r,3,12)*d;q=`كم يساوي ${L}${nu}/${d}${R} من ${m}؟`;a=m*nu/d;sp=6;info=`نقسم على ${d}: ${L}${m} ÷ ${d} = ${m/d}${R}، ثم نضرب في ${nu}: ${a}`}
   else{const price=ri(r,3,15)*5,cnt=ri(r,2,6),pay=Math.ceil(price*cnt/100)*100;q=`اشترى سامي ${cnt} دفاتر، ثمن الدفتر ${price} ليرة، ودفع ${pay} ليرة. كم الباقي؟`;a=pay-price*cnt;sp=20;info=`الثمن: ${L}${cnt} × ${price} = ${price*cnt}${R}، الباقي: ${L}${pay} − ${price*cnt} = ${a}${R}`;
     if(a===0){q=`اشترى سامي ${cnt} دفاتر، ثمن الدفتر ${price} ليرة. كم دفع؟`;a=price*cnt;info=`${L}${cnt} × ${price} = ${a}${R}`}} }
 return{type:"mcq",cat:"math",q,a:String(a),w:numWrong(a,r,sp),pic:["🧮✏️","📐✏️","🔢🧠","➕✖️"][ri(r,0,3)],info}
}
// ====== مولّد المتتاليات ======
function seqQ(n,r){
 const t=Math.ceil(n/20);let arr=[],kind=ri(r,1,t),info;
 if(kind===1){const s=ri(r,1,20),d=ri(r,2,4+n%7);for(let i=0;i<5;i++)arr.push(s+i*d);info=`نضيف ${d} كل مرة.`}
 else if(kind===2){const s=ri(r,1,4),m=ri(r,2,3);for(let i=0;i<5;i++)arr.push(s*m**i);info=`نضرب في ${m} كل مرة.`}
 else if(kind===3){let v=ri(r,10,30);const a=ri(r,3,8),b=ri(r,1,a-1);for(let i=0;i<5;i++){arr.push(v);v+=i%2?-b:a}info=`نضيف ${a} ثم نطرح ${b} بالتناوب.`}
 else if(kind===4){const s=ri(r,1,5);for(let i=0;i<5;i++)arr.push((s+i)**2);info=`هذه مربّعات الأعداد: ${s}×${s}، ${s+1}×${s+1}… والتالي ${s+4}×${s+4}.`}
 else{let a=ri(r,1,3),b=ri(r,2,5);arr=[a,b];for(let i=2;i<5;i++)arr.push(arr[i-1]+arr[i-2]);info=`كل عدد = مجموع العددين قبله: ${arr[2]}+${arr[3]}=${arr[4]}.`}
 const ans=arr.pop();
 return{type:"mcq",cat:"seq",q:`أكمل: ${arr.join("، ")}، ؟`,a:String(ans),w:numWrong(ans,r,kind===2?ans>20?Math.round(ans/3):6:6),pic:"🔢🧩",info}
}
// ====== أنواع الأسئلة ======
function bankQ(c,idx){const it=BANK[c][idx].split("|");return{type:"mcq",cat:c,q:it[0],a:it[1],w:it.slice(2),pic:PICS[c].split("|")[idx]||"❓",info:INFO[c][idx]}}
function tfQ(c,idx,r){const b=bankQ(c,idx),truth=r()<.5,shown=truth?b.a:b.w[ri(r,0,2)];
 return{type:"mcq",cat:c,label:"tf",q:`${b.q}\n👈 ${shown}`,a:truth?"صح ✅":"خطأ ❌",w:[truth?"خطأ ❌":"صح ✅"],fixed:["صح ✅","خطأ ❌"],pic:b.pic,info:(truth?"صحيح! ":`الإجابة الصحيحة: ${b.a}. `)+b.info}}
function lettersQ(n,r){const max=n<=33?3:n<=66?4:9,pool=WORDS.filter(w=>[...w[1]].length<=max),w=pool[(n*7+ri(r,0,3))%pool.length];
 let tiles=[...w[1]];if(n>50){const extra="بتثجحدرسعفقلمنهوي"[ri(r,0,16)];tiles.push(extra)}
 return{type:"letters",cat:"letters",q:"رتّب الحروف لتكتب اسم الصورة",a:w[1],tiles:shuffle(tiles,r),pic:w[0],info:`الكلمة هي «${w[1]}» ${w[0]}`}}
function oddQ(n,r){const o=ODD[(n*5+ri(r,0,2))%ODD.length];return{type:"mcq",cat:"odd",q:"أيّ صورة مختلفة عن غيرها؟",a:o.a,w:o.opts.filter(x=>x!==o.a),pic:"🧐🔍",info:o.info,emoji:true}}
function matchQ(n,r){const m=MATCH[(n*3+ri(r,0,2))%MATCH.length];return{type:"match",cat:"match",q:m.title,pairs:m.pairs,pic:"✋🎯",info:m.pairs.map(p=>`${p[0]} ← ${p[1]}`).join("   ")}}
function customQ(i){const c=S.custom[i%S.custom.length];return{type:"mcq",cat:"custom",q:c.q,a:c.a,w:c.w,pic:c.pic||"👨‍👩‍👧💬",info:c.info||"سؤال أضافه أهلك خصيصًا لك ❤️"}}
function special(n,r,kinds){const k=kinds[ri(r,0,kinds.length-1)];
 if(k==="tf")return tfQ(CATS[ri(r,0,5)],ri(r,0,49),r);if(k==="letters")return lettersQ(n,r);if(k==="odd")return oddQ(n,r);if(k==="match")return matchQ(n,r);
 if(k==="custom"&&S.custom.length)return customQ(ri(r,0,999));return oddQ(n,r)}
const finalize=(qs,r)=>qs.map(x=>x.type==="mcq"?{...x,opts:x.fixed||shuffle([x.a,...x.w],r)}:x);

// ====== بناء المرحلة ======
const gradeOf=n=>n<=33?3:n<=66?4:5;
const GRADE_NAME={3:"الصف الثالث",4:"الصف الرابع",5:"الصف الخامس"};
function currQ(g,i){const p=GRADE_Q[g][i%GRADE_Q[g].length];return{type:"mcq",cat:p[0],q:p[1],a:p[2],w:p.slice(3,6),pic:p[6],info:p[7]}}
function buildLevel(n){
 const r=rng(n*7919+13),qs=[],g=gradeOf(n),li=n-(g===3?1:g===4?34:67);
 qs.push(currQ(g,li*2));qs.push(currQ(g,li*2+1));
 qs.push(bankQ(CATS[(n-1)%6],Math.floor((n-1)/6)%50));
 qs.push(mathQ(n,r));qs.push(seqQ(n,r));
 const kind=["tf","letters","odd","match"][n%4];
 qs.push(S.custom.length&&n%3===0?customQ(n):special(n,r,[kind]));
 return finalize(shuffle(qs,r),r);
}
function buildRandom(seed,count,kinds){
 const r=rng(seed),qs=[],n=ri(r,10,90);
 for(let i=0;i<count;i++){const k=i%4;
  if(k===0)qs.push(currQ(ri(r,3,5),ri(r,0,69)));else if(k===2)qs.push(r()<.5?currQ(ri(r,3,5),ri(r,0,69)):bankQ(CATS[ri(r,0,5)],ri(r,0,49)));
  else if(k===1)qs.push(r()<.5?mathQ(ri(r,10,90),r):seqQ(ri(r,10,90),r));
  else qs.push(special(n,r,kinds))}
 return finalize(shuffle(qs,r),r);
}

let AC;function beep(f,d,type="sine",v=.15,delay=0){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+delay;o.start(t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.stop(t+d)}catch(e){}}
const sfx={ok(){beep(660,.15,"triangle");beep(880,.25,"triangle",.15,.12)},bad(){beep(200,.35,"sawtooth",.08)},click(){beep(500,.06,"square",.05)},
 win(){[523,659,784,1047].forEach((f,i)=>beep(f,.3,"triangle",.15,i*.13))},lose(){[400,300,220].forEach((f,i)=>beep(f,.3,"sine",.12,i*.15))},
 hit(){beep(140,.2,"square",.12);beep(90,.3,"sawtooth",.08,.08)}};

const hasAndroid=()=>window.Android&&typeof Android.speak==="function";
function say(text,force){
 if(!S.voice&&!force)return;text=String(text).replace(/[⁦-⁩]/g,"").replace(/[×]/g," ضرب ").replace(/÷/g," تقسيم ").replace(/−/g," ناقص ").replace(/\+/g," زائد ").replace(/=/g," يساوي ").replace(/\?|؟/g,"؟").replace(/👈/g,"،");
 try{if(hasAndroid()){Android.speak(text);return}
  if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ar-SA";u.rate=.95;
   const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}}catch(e){}}
function stopSay(){try{if(hasAndroid())Android.stopSpeak();else if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
const PHRASES={
 ok:["أحسنت!","ممتاز!","رائع!","إجابة صحيحة!","أنت بطل!","عبقري!","برافو!","ما شاء الله!"],
 bad:["خطأ، لا بأس!","للأسف خطأ، ركّز أكثر","إجابة خاطئة، ستنجح في المرة القادمة"],
 win:["ممتاز يا بطل! أنهيت المرحلة","مبروك! أحسنت","رائع جدًا! استمر"],
 lose:["لا بأس، حاول مرة أخرى","لم تنجح هذه المرة، جرّب من جديد"]};
let lastAudio;
function praise(kind){
 if(!S.voice)return;
 if(S.rec&&S.rec[kind]){try{lastAudio&&lastAudio.pause();lastAudio=new Audio(S.rec[kind]);lastAudio.play();return}catch(e){}}
 const list=PHRASES[kind];let p=list[Math.floor(Math.random()*list.length)];
 if(S.name&&(kind==="ok"||kind==="win")&&Math.random()<.4)p=p.replace(/!$/,"")+` يا ${S.name}!`;
 say(p);
}

function place(i){if(cur.locked)return;const q=cur.qs[cur.i],k=cur.slots.indexOf(null);if(k<0)return;
 cur.slots[k]=i;$("tile"+i).classList.add("used");$("tile"+i).disabled=true;sfx.click();drawSlots();

  else{cur.mist++;sfx.bad();$("slots").classList.add("shake");setTimeout(()=>{$("slots").classList.remove("shake");cur.slots.forEach((j,s)=>{if(j!==null&&q.tiles[j]!==[...q.a][s]){unplace(s,true)}})},450);

 $("qOpts").innerHTML=`<div class="mcol">${L.map(x=>`<div class="chip" data-k="${x.k}">${esc(x.t)}</div>`).join("")}</div><div class="mcol">${Rt.map(x=>`<div class="target" data-k="${x.k}">${esc(x.t)}</div>`).join("")}</div>`;
 document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("pointerdown",e=>{if(cur.locked||c.classList.contains("done"))return;e.preventDefault();
   const g=c.cloneNode(true);g.classList.add("ghost");document.body.appendChild(g);const mv=ev=>{g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px"};mv(e);
   c.classList.add("lift");let moved=false;const sx=e.clientX,sy=e.clientY;
   const onMove=ev=>{if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>8)moved=true;mv(ev)};
   const onUp=ev=>{removeEventListener("pointermove",onMove);removeEventListener("pointerup",onUp);g.remove();c.classList.remove("lift");
    if(!moved){selectChip(c);return}
    const t=document.elementFromPoint(ev.clientX,ev.clientY);const tg=t&&t.closest(".target");if(tg)dropOn(c,tg)};
   addEventListener("pointermove",onMove);addEventListener("pointerup",onUp)})});

}

function openDuel(){
 modal(`<h2>🤝 تحدٍّ بين لاعبَين</h2><p>10 أسئلة، كل لاعب يجيب بدوره على نفس الجوال</p>
 <input class="inp" id="d1" style="border-color:#93c5fd" placeholder="اللاعب الأول" value="${esc(S.name||"")}">
 <input class="inp" id="d2" style="border-color:#f9a8d4;margin-top:8px" placeholder="اللاعب الثاني" value="">
 <div class="row"><button class="bigbtn green" onclick="const a=$('d1').value.trim()||'اللاعب 1',b=$('d2').value.trim()||'اللاعب 2';closeModal();startDuel(a,b)">▶ ابدأ</button><button class="bigbtn alt" onclick="closeModal()">رجوع</button></div>`)}
function finishDuel(){
 const [a,b]=cur.players;S.duels++;save();
 const win=a.score===b.score?null:a.score>b.score?a:b;
 $("rTitle").textContent=win?`🏆 الفائز: ${win.name}`:"🤝 تعادل!";$("rAvatar").innerHTML="⚔️";
 $("rInfo").innerHTML=`<span style="color:#93c5fd">${esc(a.name)}: <b>${a.score}</b></span> &nbsp;—&nbsp; <span style="color:#f9a8d4">${esc(b.name)}: <b>${b.score}</b></span>`;
 $("rNext").style.display="none";$("rRetry").style.display="";$("rMap").textContent="🏠 الرئيسية";
 showResultStars(-1);sfx.win();confetti();say(win?`مبروك يا ${win.name}! أنت الفائز`:"تعادل! كلاكما بطل");setTimeout(()=>{checkBadges();runQueue()},1200);
}

// ====== الأوسمة ======
const BADGES=[
 ["first","🥇","البداية","أنهِ أول مرحلة",()=>levelsDone()>=1],
 ["lv10","🏝️","المستكشف","أنهِ 10 مراحل",()=>levelsDone()>=10],
 ["lv50","🧭","الرحّالة","أنهِ 50 مرحلة",()=>levelsDone()>=50],
 ["lv100","👑","بطل الأذكياء","أنهِ المراحل المئة",()=>levelsDone()>=100],
 ["s3x10","⭐","النجم اللامع","10 مراحل بثلاث نجوم",()=>Object.values(S.stars).filter(x=>x===3).length>=10],
 ["s150","🌟","جامع النجوم","اجمع 150 نجمة",()=>totalStars()>=150],
 ["boss1","⚔️","صائد الوحوش","اهزم أول وحش",()=>Object.keys(S.bosses).length>=1],
 ["boss5","🐉","قاهر التنانين","اهزم 5 وحوش",()=>Object.keys(S.bosses).length>=5],
 ["chest3","🎁","صائد الكنوز","افتح 3 صناديق كنز",()=>Object.keys(S.chests).length>=3],
 ["miss5","🎯","بطل المهمات","أنجز 5 مهمات حقيقية",()=>Object.keys(S.missions).length>=5],
 ["miss20","🏅","بطل الحياة","أنجز 20 مهمة حقيقية",()=>Object.keys(S.missions).length>=20],
 ["st3","🔥","المثابر","تحدي اليوم 3 أيام متتالية",()=>S.daily.best>=3],
 ["st7","☄️","لا يتوقف","تحدي اليوم 7 أيام متتالية",()=>S.daily.best>=7],
 ["rich","💰","الثري","اربح 1000 عملة",()=>S.earned>=1000],
 ["shop","🛍️","المتسوّق","اشترِ أول شيء من المتجر",()=>S.buys>=1],
 ["duel","🤝","المنافس","العب تحدي لاعبَين",()=>S.duels>=1]];
function checkBadges(){let got=[];BADGES.forEach(b=>{if(!S.badges[b[0]]&&b[4]()){S.badges[b[0]]=todayStr();addCoins(20);got.push(b)}});
 if(got.length){save();got.forEach(b=>pushModal(()=>{modal(`<div class="badgebig">${b[1]}</div><h2>وسام جديد!</h2><p style="font-size:22px;font-weight:900;margin:0">${b[2]}</p><p>${b[3]}<br>🪙 +20 عملة</p><div class="row"><button class="bigbtn green" onclick="closeModal()">رائع!</button></div>`);sfx.win();confetti();say("مبروك! حصلت على وسام "+b[2])}))}}
function openBadges(){sfx.click();const n=Object.keys(S.badges).length;
 modal(`<h2>🏅 أوسمتي (${n}/${BADGES.length})</h2><div class="items">${BADGES.map(b=>`<div class="item badge ${S.badges[b[0]]?"on":"off"}"><div class="ic">${S.badges[b[0]]?b[1]:"🔒"}</div><b>${b[2]}</b><small>${b[3]}</small></div>`).join("")}</div>
 ${S.stars[100]?`<div class="row"><button class="bigbtn green" onclick="showCertificate()">🎓 شهادتي</button></div>`:""}
 <div class="row"><button class="bigbtn" onclick="closeModal()">إغلاق</button></div>`)}

// ====== المهمات ======
const allMissions=()=>MISSIONS.concat(S.customM.map(m=>"👨‍👩‍👧 "+m));
function showMission(n){const M=allMissions(),m=M[(n/5-1)%M.length];sfx.win();say("مهمة حقيقية! "+m.replace(/^\S+\s/,""));
 modal(`<div style="font-size:54px">🎯</div><h2>مهمة حقيقية!</h2><p style="font-size:21px;font-weight:800">${esc(m)}</p><p style="font-size:15px;opacity:.7">نفّذ المهمة ثم اضغط «أنجزتها» لتحصل على 50🪙</p>
 <div class="row"><button class="bigbtn green" onclick="doneMission(${n})">✅ أنجزتها</button><button class="bigbtn alt" onclick="closeModal()">لاحقًا</button></div>`)}
function doneMission(n){S.missions[n]=todayStr();addCoins(50);save();closeModal();confetti();sfx.win();praise("ok");toast("🎉 أحسنت! +50 عملة");checkBadges();runQueue()}

// ====== الإعدادات ======
function openSettings(){sfx.click();const pending=Object.keys(S.stars).filter(n=>n%5===0&&S.stars[n]&&!S.missions[n]);
 modal(`<h2>⚙️ الإعدادات</h2>
 <div class="setrow">🔔 المؤثرات الصوتية <div class="toggle ${S.sound?"on":""}" onclick="S.sound=!S.sound;save();this.classList.toggle('on')"></div></div>
 <div class="setrow">🗣️ الصوت الناطق (أحسنت، خطأ…) <div class="toggle ${S.voice?"on":""}" onclick="S.voice=!S.voice;save();this.classList.toggle('on');if(S.voice)praise('ok')"></div></div>
 <div class="setrow">⭐ النجوم <span>${totalStars()} / 300</span></div>
 <div class="setrow">🎯 المهمات المنجزة <span>${Object.keys(S.missions).length}</span></div>
 ${pending.length?`<div class="row"><button class="bigbtn green" style="font-size:17px" onclick="showMission(${pending[0]})">🎯 مهمة بانتظارك</button></div>`:""}
 <div class="row"><button class="bigbtn alt" style="font-size:17px;padding:12px 18px" onclick="openProfile()">👤 تعديل ملفي</button><button class="bigbtn alt" style="font-size:17px;padding:12px 18px" onclick="openParent()">👨‍👩‍👧 لوحة الأهل</button></div>
 <p style="margin-bottom:0">تطوير <b>أبو عبدالله الشامي</b></p>
 <a class="wa" href="https://wa.me/963968744241">💬 تواصل مع المطور</a>
 <div class="row"><button class="bigbtn" onclick="closeModal()">إغلاق</button></div>`)}

// ====== لوحة الأهل ======
let pinBuf="";
function openParent(){sfx.click();pinBuf="";const setup=!S.pin;
 modal(`<h2>👨‍👩‍👧 لوحة الأهل</h2><p>${setup?"أنشئ رمزًا سريًا من 4 أرقام (للأهل فقط)":"أدخل الرمز السري"}</p><div class="pinshow" id="pinshow">○○○○</div>
 <div class="pinpad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"✖"].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join("")}</div>`)}
function pinKey(k){if(k==="✖")return closeModal();if(k==="⌫")pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;sfx.click();
 $("pinshow").textContent="●".repeat(pinBuf.length)+"○".repeat(4-pinBuf.length);
 if(pinBuf.length===4){if(!S.pin){S.pin=pinBuf;save();toast("✔ تم حفظ الرمز");parentPanel()}else if(pinBuf===S.pin)parentPanel();else{sfx.bad();pinBuf="";$("pinshow").textContent="✖ رمز خاطئ";}}}
let ptab="stats";
function parentPanel(tab){ptab=tab||ptab;let body="";
 if(ptab==="stats"){const rows=Object.keys(CATNAME).filter(c=>S.cs[c]&&S.cs[c][1]).map(c=>{const [r,t]=S.cs[c],p=Math.round(r/t*100);return{c,r,t,p}}).sort((a,b)=>b.p-a.p);
  body=`<div class="kpis"><div><b>${levelsDone()}</b><small>مرحلة</small></div><div><b>${totalStars()}</b><small>نجمة</small></div><div><b>${Object.keys(S.missions).length}</b><small>مهمة</small></div><div><b>${S.daily.best}</b><small>أطول سلسلة</small></div></div>
  ${rows.length?rows.map(x=>`<div class="bar"><span>${CATNAME[x.c]}</span><div><i style="width:${x.p}%;background:${x.p>=75?"#22c55e":x.p>=50?"#f59e0b":"#ef4444"}"></i></div><b>${x.p}٪</b><small>${x.r}/${x.t}</small></div>`).join("")+
  `<p style="font-size:15px">💪 الأقوى: <b>${CATNAME[rows[0].c]}</b>${rows.length>1?`<br>📌 يحتاج تدريبًا: <b>${CATNAME[rows[rows.length-1].c]}</b>`:""}</p>`:"<p>لم يلعب بعد.</p>"}
  ${Object.keys(S.missions).length?`<p style="font-size:14px;text-align:right">🎯 المهمات المنجزة:<br>${Object.keys(S.missions).map(n=>`• ${esc(allMissions()[(n/5-1)%allMissions().length])} <small>(${S.missions[n]===1?"":S.missions[n]})</small>`).join("<br>")}</p>`:""}`}
 else if(ptab==="q"){body=`<p style="font-size:15px">أضف أسئلتك الخاصة، وستظهر لطفلك داخل المراحل وتحدي اليوم</p>
  <input class="inp" id="cq" placeholder="السؤال"><input class="inp ok" id="ca" placeholder="✅ الإجابة الصحيحة"><input class="inp" id="w1" placeholder="❌ إجابة خاطئة 1"><input class="inp" id="w2" placeholder="❌ إجابة خاطئة 2"><input class="inp" id="w3" placeholder="❌ إجابة خاطئة 3"><input class="inp" id="ci" placeholder="💡 معلومة تظهر بعد الإجابة (اختياري)">
  <div class="row"><button class="bigbtn green" style="font-size:18px" onclick="addCustom()">➕ إضافة السؤال</button></div>
  ${S.custom.map((c,i)=>`<div class="li"><span>${esc(c.q)} <small>(${esc(c.a)})</small></span><button onclick="S.custom.splice(${i},1);save();parentPanel()">🗑️</button></div>`).join("")}`}
 else if(ptab==="m"){body=`<p style="font-size:15px">أضف مهمات من عندك، تظهر بعد كل 5 مراحل</p><input class="inp" id="cm" placeholder="مثال: ساعد بابا في غسل السيارة"><div class="row"><button class="bigbtn green" style="font-size:18px" onclick="const v=$('cm').value.trim();if(v){S.customM.push(v);save();parentPanel()}">➕ إضافة المهمة</button></div>
  ${S.customM.map((m,i)=>`<div class="li"><span>${esc(m)}</span><button onclick="S.customM.splice(${i},1);save();parentPanel()">🗑️</button></div>`).join("")}`}
 else if(ptab==="v"){const R=[["ok","✅ عند الإجابة الصحيحة","أحسنت يا بطل!"],["bad","❌ عند الخطأ","لا بأس، حاول مرة أخرى"],["win","🏆 عند الفوز بالمرحلة","ممتاز! أنا فخور بك"]];
  body=`<p style="font-size:15px">سجّل صوتك ليسمعه طفلك بدل الصوت الآلي ❤️<br><small>اضغط 🎙️ وتكلّم (3 ثوانٍ)</small></p>${R.map(x=>`<div class="li"><span>${x[1]}<br><small>مثال: «${x[2]}»</small></span><span style="display:flex;gap:6px"><button id="rb_${x[0]}" onclick="recordClip('${x[0]}')">🎙️</button>${S.rec[x[0]]?`<button onclick="new Audio(S.rec['${x[0]}']).play()">▶️</button><button onclick="delete S.rec['${x[0]}'];save();parentPanel()">🗑️</button>`:""}</span></div>`).join("")}`}
 else{body=`<div class="row"><button class="bigbtn alt" style="font-size:17px" onclick="showCertificate(true)">🎓 معاينة الشهادة</button></div>
  <div class="row"><button class="bigbtn alt" style="font-size:17px" onclick="S.pin='';save();openParent()">🔑 تغيير الرمز</button></div>
  <div class="row"><button class="bigbtn" style="background:#ef4444;color:#fff;box-shadow:0 6px 0 #991b1b;font-size:17px" onclick="askReset()">🗑️ مسح كل التقدّم</button></div>`}
 modal(`<h2>👨‍👩‍👧 لوحة الأهل</h2><div class="tabs">${[["stats","📊 التقدّم"],["q","➕ أسئلة"],["m","🎯 مهمات"],["v","🎙️ صوتي"],["s","⚙️"]].map(t=>`<button class="${ptab===t[0]?"on":""}" onclick="parentPanel('${t[0]}')">${t[1]}</button>`).join("")}</div>${body}
 <div class="row"><button class="bigbtn" onclick="closeModal()">إغلاق</button></div>`)}
function addCustom(){const g=id=>$(id).value.trim(),q=g("cq"),a=g("ca"),w=[g("w1"),g("w2"),g("w3")];
 if(!q||!a||w.some(x=>!x)){toast("✏️ اكتب السؤال والإجابات الأربع");return}if(new Set([a,...w]).size<4){toast("⚠️ الإجابات يجب أن تكون مختلفة");return}
 S.custom.push({q,a,w,info:g("ci")});save();toast("✔ أُضيف السؤال");parentPanel()}
function recordClip(kind){
 const btn=$("rb_"+kind);if(!navigator.mediaDevices||!window.MediaRecorder){toast("⚠️ التسجيل غير مدعوم على هذا الجهاز");return}
 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{const rec=new MediaRecorder(stream),ch=[];rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const fr=new FileReader();fr.onload=()=>{S.rec[kind]=fr.result;save();toast("✔ تم حفظ صوتك");parentPanel()};fr.readAsDataURL(new Blob(ch,{type:rec.mimeType}))};
  rec.start();btn.textContent="🔴";let t=3;const iv=setInterval(()=>{t--;btn.textContent="🔴"+t;if(t<=0){clearInterval(iv);rec.stop()}},1000)})
 .catch(()=>toast("⚠️ اسمح للتطبيق باستخدام الميكروفون"))}
function askReset(){modal(`<h2>⚠️ متأكد؟</h2><p>سيتم حذف كل النجوم والعملات والأوسمة والبدء من جديد.</p><div class="row"><button class="bigbtn alt" onclick="parentPanel()">إلغاء</button><button class="bigbtn" style="background:#ef4444;color:#fff;box-shadow:0 6px 0 #991b1b" onclick="const k={name:S.name,photo:S.photo,pin:S.pin,custom:S.custom,customM:S.customM,rec:S.rec,profileDone:S.profileDone};S=Object.assign(DEF(),k);save();closeModal();refreshHome()">نعم، امسح</button></div>`)}

// ====== الشهادة ======
function drawCertificate(){
 const c=document.createElement("canvas"),W=1400,H=1000;c.width=W;c.height=H;const x=c.getContext("2d");
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#fff8e1");g.addColorStop(1,"#ffe9b0");x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle="#b7791f";x.lineWidth=18;x.strokeRect(30,30,W-60,H-60);x.strokeStyle="#7c5cff";x.lineWidth=5;x.strokeRect(60,60,W-120,H-120);
 x.textAlign="center";x.direction="rtl";const F='"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif';
 x.font=`110px ${F}`;x.fillText("🏆",W/2,200);
 x.fillStyle="#5b21b6";x.font=`900 84px ${F}`;x.fillText("شهادة بطل دار الوحي",W/2,310);
 x.fillStyle="#334155";x.font=`40px ${F}`;x.fillText("تشهد «لعبة أطفال دار الوحي» بأن البطل",W/2,400);
 x.fillStyle="#b45309";x.font=`900 96px ${F}`;x.fillText(S.name||"البطل",W/2,520);
 x.fillStyle="#334155";x.font=`40px ${F}`;x.fillText(`أتمّ المراحل المئة بنجاح، وجمع ${totalStars()} نجمة و${Object.keys(S.badges).length} وسامًا`,W/2,610);
 x.fillText("فبارك الله فيه ونفع به 🌟",W/2,670);
 x.font=`34px ${F}`;x.fillStyle="#64748b";x.fillText("التاريخ: "+todayStr(),W/2,770);
 x.font=`bold 32px ${F}`;x.fillStyle="#7c3aed";x.fillText("تطوير أبو عبدالله الشامي",W/2,900);
 x.font=`90px ${F}`;x.fillText("🦉",200,880);x.fillText("⭐",W-200,880);
 return c.toDataURL("image/png");
}
function showCertificate(preview){const url=drawCertificate();if(!preview){confetti();say(`مبروك يا ${S.name||"بطل"}! هذه شهادتك`)}
 modal(`<h2>🎓 الشهادة</h2>${preview&&!S.stars[100]?"<p style='font-size:14px'>(معاينة — تُمنح عند الوصول إلى النهاية)</p>":""}<img src="${url}" style="width:100%;border-radius:12px;box-shadow:0 6px 16px #0003">
 <div class="row">${!preview||S.stars[100]?`<button class="bigbtn green" onclick="saveCert()">💾 حفظ الصورة</button>`:""}<button class="bigbtn" onclick="closeModal()">إغلاق</button></div>`)}
function saveCert(){const url=drawCertificate();
 if(window.Android&&Android.saveImage){Android.saveImage(url.split(",")[1],"شهادة_"+(S.name||"البطل")+".png")}
 else{const a=document.createElement("a");a.href=url;a.download="شهادة_أطفال_دار_الوحي.png";document.body.appendChild(a);a.click();a.remove()}}

// ====== النوافذ والتنقل ======
let modalQ=[],modalLock=false;
function modal(html,lock){$("modalBox").innerHTML=html;$("modal").classList.add("on");modalLock=!!lock;$("modalBox").scrollTop=0}
function closeModal(){if(modalLock)return;$("modal").classList.remove("on");stopRec();if(document.querySelector(".screen.on").id==="home")refreshHome();setTimeout(runQueue,250)}
function stopRec(){}
function pushModal(fn){modalQ.push(fn)}
function runQueue(){if($("modal").classList.contains("on")||!modalQ.length)return;modalQ.shift()()}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));if(id==="home")refreshHome()}
function refreshHome(){$("hStars").textContent=totalStars();$("hCoins").textContent=S.coins;$("hLevel").textContent=maxUnlocked();
 $("hAvatar").innerHTML=`<div class="hg">${girlSVG("m","happy")}</div><div class="hme">${avatarHTML(70)}</div><div class="hg flip">${girlSVG("s","happy")}</div>`;$("hHello").textContent=S.name?`أهلًا يا ${S.name} 👋`:"أهلًا بك 👋";
 const done=S.daily.last===todayStr(),y=todayStr(new Date(Date.now()-864e5)),st=S.daily.last===y||done?S.daily.streak:0;
 $("hDaily").innerHTML=done?`✅ أنجزت تحدي اليوم <small>🔥${st}</small>`:`📅 تحدي اليوم ${st?`<small>🔥${st}</small>`:""}`;$("hDaily").classList.toggle("done",done);
 $("hBadges").textContent=`🏅 الأوسمة ${Object.keys(S.badges).length}/${BADGES.length}`}
window.appBack=function(){if($("modal").classList.contains("on")){if(!modalLock)closeModal();return true}
 const c=document.querySelector(".screen.on").id;if(c==="home")return false;
 if(c==="quiz"){confirmQuit();return true}if(c==="result"){resultBack();return true}show("home");return true};
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2000)}
function confetti(){const c=$("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6}));
 let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
 if(f++<160)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})()}

// ====== البدء ======
(function(){let h="";for(let i=0;i<50;i++)h+=`<i style="top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s"></i>`;$("sky").innerHTML=h})();
if(window.speechSynthesis)try{speechSynthesis.getVoices()}catch(e){}
refreshHome();
if(!S.profileDone)setTimeout(()=>openProfile(true),400);

</script>
