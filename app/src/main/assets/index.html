<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لعبة أطفال دار الوحي</title>
<style>
:root{--bg1:#1b1f5e;--bg2:#3a1c71;--card:#ffffff;--ink:#1d1d3a;--gold:#ffc83d;--ok:#22c55e;--bad:#ef4444;--acc:#7c5cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:#fff;overflow:hidden}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
button{font-family:inherit;border:0;cursor:pointer}
.bigbtn{background:linear-gradient(180deg,#ffd75e,#ffb31a);color:#4a2b00;font-size:22px;font-weight:800;padding:16px 30px;border-radius:22px;box-shadow:0 6px 0 #c77f00,0 10px 20px #0005;transition:transform .1s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #c77f00}
.bigbtn.alt{background:linear-gradient(180deg,#8f7bff,#6246ea);color:#fff;box-shadow:0 6px 0 #3d26b5,0 10px 20px #0005}
.bigbtn.green{background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff;box-shadow:0 6px 0 #0f7a36,0 10px 20px #0005}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.pill{background:#0004;border-radius:30px;padding:8px 14px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.iconbtn{background:#ffffff22;color:#fff;width:44px;height:44px;border-radius:14px;font-size:22px}
/* stars bg */
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.6;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.1}}
/* home */
#home{align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px}
.logo{font-size:84px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px #0006)}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}
h1.title{margin:0;font-size:44px;font-weight:900;background:linear-gradient(90deg,#ffe27a,#ffb3e6,#8be9ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.sub{opacity:.85;font-size:17px;margin-top:-8px}
.homestats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.credit{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:14px;opacity:.8}
/* map: طريق متعرّج */
#map .topbar{position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(#0008,#0000)}
#map .scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:auto}
.road{position:relative;width:100%}
.zone{position:absolute;left:0;right:0}
.zone .zname{position:absolute;bottom:14px;left:10px;background:#0006;padding:6px 12px;border-radius:14px;font-weight:800;font-size:15px;z-index:2}
.zone .zname small{opacity:.8;font-weight:600;margin-right:6px}
.deco{position:absolute;font-size:30px;opacity:.9;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 3px 3px #0004)}
.deco.big{font-size:44px}
.deco.sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:translate(-50%,-50%) rotate(6deg) translateY(-4px)}}
svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#fff;color:var(--ink);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0004,0 0 0 5px #ffffff55;z-index:3}
.node .st{position:absolute;bottom:-17px;font-size:13px;color:#ffd23d;text-shadow:0 1px 2px #000;white-space:nowrap;letter-spacing:-1px}
.node.locked{background:#3b3b5a;color:#9a9ab8;box-shadow:0 5px 0 #0005}
.node.challenge{background:radial-gradient(#fff3b0,#ffb21f);width:66px;height:66px}
.node.mission{background:radial-gradient(#d9fbe3,#4ade80)}
.node.locked.challenge,.node.locked.mission{background:#4a4a66}
.node .tag{position:absolute;top:-10px;left:-8px;font-size:18px}
.node.current{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #0004,0 0 0 12px #ffffff33}}
.flag{position:absolute;transform:translate(-50%,-50%);text-align:center;font-weight:900;font-size:18px;z-index:3;text-shadow:0 2px 4px #000}
.flag b{display:block;font-size:56px;animation:bob 2.4s ease-in-out infinite}
#avatar{position:absolute;font-size:44px;transform:translate(-50%,-110%);z-index:4;transition:left .45s ease-in-out,top .45s ease-in-out;filter:drop-shadow(0 4px 4px #0006);pointer-events:none}
#avatar span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
/* المشهد فوق السؤال */
.stage{position:relative;height:clamp(170px,30vh,270px);border-radius:26px;overflow:hidden;box-shadow:0 10px 26px #0005;flex-shrink:0}
.stage .badge{position:absolute;top:10px;right:10px;background:#000a;color:#fff;padding:5px 12px;border-radius:14px;font-weight:800;font-size:14px;z-index:2}
.stage .badge.num{right:auto;left:10px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage .pic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:76px;display:flex;gap:6px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 8px #0005);white-space:nowrap}
.stage .pic.math{font-size:44px;font-weight:900;color:#fff;font-family:"Comic Sans MS","Segoe UI",sans-serif;direction:ltr;text-shadow:0 3px 0 #0003}
@keyframes float{50%{transform:translate(-50%,-58%)}}
.stage.happy .pic{animation:happy .6s}
@keyframes happy{40%{transform:translate(-50%,-75%) scale(1.25) rotate(-8deg)}}
.stage.sad .pic{animation:sad .5s}
@keyframes sad{25%{transform:translate(-40%,-50%)}75%{transform:translate(-60%,-50%)}}
.cloud{animation:drift 18s linear infinite}
.cloud.c2{animation-duration:26s;animation-delay:-9s}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(460px)}}
.twk{animation:tw 2s infinite}
.spin{transform-origin:center;transform-box:fill-box;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(-20px)}}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;left:50%;top:50%;font-style:normal;font-size:24px;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
/* quiz */
#quiz{padding-bottom:12px}
.progress{height:12px;background:#0004;border-radius:10px;margin:0 16px;overflow:hidden}
.progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#a3e635);border-radius:10px;transition:width .4s}
.qwrap{flex:1;display:flex;flex-direction:column;padding:12px 16px;gap:12px;overflow-y:auto}
.cat{align-self:center;background:#ffffff26;padding:6px 16px;border-radius:20px;font-weight:700;font-size:15px}
.qcard{background:var(--card);color:var(--ink);border-radius:22px;padding:14px 16px;font-size:21px;font-weight:800;text-align:center;line-height:1.55;box-shadow:0 8px 0 #0002,0 12px 24px #0004;min-height:76px;margin-top:-34px;position:relative;z-index:2;margin-inline:8px;display:flex;align-items:center;justify-content:center;animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#fff;color:var(--ink);font-size:18px;font-weight:800;padding:12px 8px;border-radius:18px;box-shadow:0 6px 0 #c9c3ff;min-height:62px;line-height:1.4;transition:transform .1s,background .2s}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:0 6px 0 #15803d;animation:jump .4s}
.opt.bad{background:var(--bad);color:#fff;box-shadow:0 6px 0 #991b1b;animation:shake .4s}
.opt.gone{visibility:hidden}
@keyframes jump{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.helpers{display:flex;gap:10px;justify-content:center}
.helper{background:#ffffff22;color:#fff;font-weight:800;font-size:15px;padding:10px 14px;border-radius:16px}
.helper:disabled{opacity:.35}
.timer{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,100%),#0004 0);display:flex;align-items:center;justify-content:center;font-weight:900}
.timer span{background:var(--bg2);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* result */
#result{align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px}
.bigstars{font-size:64px;display:flex;gap:10px}
.bigstars span{opacity:.2;transform:scale(.5);transition:all .4s cubic-bezier(.3,1.8,.5,1)}
.bigstars span.on{opacity:1;transform:scale(1)}
.rescard{background:#ffffff1c;border-radius:24px;padding:18px 26px;font-size:19px;line-height:2}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* modal */
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.box{background:#fff;color:var(--ink);border-radius:28px;padding:24px 20px;max-width:420px;width:100%;text-align:center;animation:pop .3s}
.box h2{margin:0 0 10px}
.box p{font-size:18px;line-height:1.7}
.box .row{margin-top:14px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #eee;font-size:18px;font-weight:700}
.toggle{width:60px;height:34px;border-radius:20px;background:#ccc;position:relative}
.toggle.on{background:var(--ok)}
.toggle::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on::after{right:30px}
.wa{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:16px;margin-top:6px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:14px;font-weight:700;z-index:70;display:none}

/* ===== إضافات النسخة 2 ===== */
#home{justify-content:flex-start;padding-top:max(26px,5vh);overflow-y:auto}
.hAv{cursor:pointer;animation:bob 2.4s ease-in-out infinite;margin-top:10px;filter:drop-shadow(0 8px 12px #0006)}
.hello{font-size:30px;font-weight:900;margin:0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px}
.menu .bigbtn{font-size:17px;padding:13px 8px;border-radius:18px}
.menu .wide{grid-column:1/-1;font-size:24px;padding:18px}
.bigbtn.daily{background:linear-gradient(180deg,#fb923c,#ea580c);color:#fff;box-shadow:0 6px 0 #9a3412,0 10px 20px #0005}
.bigbtn.daily.done{background:linear-gradient(180deg,#86efac,#22c55e);box-shadow:0 6px 0 #15803d}
.bigbtn small{font-size:14px}
.credit{position:static;margin-top:auto;padding:14px 0 6px}
.qcard{white-space:pre-line}
.opts.two{grid-template-columns:1fr 1fr}.opts.two .opt{font-size:22px;min-height:70px}
.opts.emo .opt{font-size:44px;min-height:84px}
.stage .speak{position:absolute;bottom:40px;right:10px;width:42px;height:42px;border-radius:50%;background:#fff;font-size:20px;box-shadow:0 3px 8px #0005;z-index:3}
.boss{position:absolute;left:12px;bottom:40px;text-align:center;z-index:2}
.boss .bem{font-size:58px;line-height:1;animation:bossIdle 1.8s ease-in-out infinite;filter:drop-shadow(0 6px 6px #0007)}
.boss .hp{font-size:13px;background:#0008;border-radius:10px;padding:2px 6px;margin-top:2px}
@keyframes bossIdle{50%{transform:scale(1.08) rotate(4deg)}}
.boss.hit .bem{animation:bossHit .5s}
@keyframes bossHit{30%{transform:translateX(-14px) rotate(-15deg) scale(.85);filter:brightness(3)}}
.boss.laugh .bem{animation:bossLaugh .6s}
@keyframes bossLaugh{25%,75%{transform:translateY(-10px) scale(1.15)}50%{transform:translateY(0)}}
#explain{display:none;background:#fff;color:var(--ink);border-radius:20px;padding:12px 14px;box-shadow:0 8px 20px #0004;animation:pop .3s}
#explain.on{display:block}
.exh{font-weight:900;font-size:18px}.exh.good{color:#16a34a}.exh.oops{color:#dc2626}
.ext{font-size:16px;line-height:1.7;margin-top:4px}
#explain .helper{background:#ede9fe;color:#5b21b6}
/* رتّب الحروف */
.letters{display:flex;flex-direction:column;gap:14px;align-items:center}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:52px;height:58px;border-radius:14px;background:#ffffff22;border:3px dashed #ffffff88;color:#fff;font-size:30px;font-weight:900}
.slot.ok{background:var(--ok);border-color:var(--ok)}.slot.bad{background:var(--bad);border-color:var(--bad)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:56px;height:60px;border-radius:16px;background:#fff;color:var(--ink);font-size:30px;font-weight:900;box-shadow:0 5px 0 #c9c3ff;transition:transform .15s}
.tile.used{opacity:.15;transform:scale(.8)}
.wordok{font-size:34px;font-weight:900;color:#bbf7d0}
.shake{animation:shake .4s}
/* اسحب وطابق */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:10px}
.chip,.target{border-radius:16px;min-height:60px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;padding:6px}
.chip{background:#fff;color:var(--ink);box-shadow:0 5px 0 #c9c3ff;touch-action:none;cursor:grab;font-size:32px}
.chip.sel{outline:4px solid var(--gold)}.chip.lift{opacity:.3}.chip.done{visibility:hidden}
.target{background:#ffffff1f;border:3px dashed #ffffffaa;color:#fff}
.target.done{background:var(--ok);border-color:var(--ok)}
.ghost{position:fixed;transform:translate(-50%,-50%) scale(1.1);z-index:99;pointer-events:none;width:110px}
/* نوافذ وأدوات */
.box{max-height:88vh;overflow-y:auto}
.inp{width:100%;font-family:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid #ddd6fe;margin-top:6px;text-align:right;user-select:text}
.inp.ok{border-color:#86efac}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.tabs button{background:#ede9fe;color:#4c1d95;font-weight:800;padding:8px 12px;border-radius:12px;font-size:15px}
.tabs button.on{background:#7c3aed;color:#fff}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.items.small{grid-template-columns:repeat(5,1fr)}
.item{background:#f5f3ff;border-radius:16px;padding:10px 4px;border:3px solid transparent;color:var(--ink);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.item.on{border-color:#22c55e;background:#dcfce7}
.item .ic{font-size:38px;line-height:1.1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.items.small .ic{font-size:30px}
.item .pr{font-size:13px;font-weight:800}
.item .sw{display:block;width:46px;height:20px;border-radius:10px}
.item small{font-size:11px;opacity:.75}
.item.badge.off{opacity:.45}.item.badge b{font-size:13px}
.mini{display:flex;justify-content:center;margin-top:20px}
.pinshow{font-size:34px;letter-spacing:10px;margin:6px 0 10px;font-weight:900;color:#7c3aed}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:auto}
.pinpad button{font-size:26px;font-weight:900;padding:14px;border-radius:16px;background:#ede9fe;color:#4c1d95}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpis div{background:#f5f3ff;border-radius:14px;padding:8px 2px}.kpis b{display:block;font-size:24px;color:#7c3aed}.kpis small{font-size:12px}
.bar{display:grid;grid-template-columns:118px 1fr 44px 44px;align-items:center;gap:6px;font-size:13px;margin:6px 0;text-align:right}
.bar div{height:14px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f8fafc;border-radius:12px;padding:8px 10px;margin:6px 0;text-align:right;font-size:15px}
.li button{background:#ede9fe;border-radius:10px;padding:8px 10px;font-size:18px}
.chest{font-size:110px;cursor:pointer;animation:bob 1.6s ease-in-out infinite;margin:6px 0}
.shakebig{animation:shakebig .9s!important}
@keyframes shakebig{10%,30%,50%,70%,90%{transform:rotate(-12deg) scale(1.1)}20%,40%,60%,80%{transform:rotate(12deg) scale(1.15)}}
.badgebig{font-size:96px;animation:pop .5s,bob 2s 1s ease-in-out infinite}
#rAvatar{font-size:64px}

/* ===== مريم وسلمى ===== */
#qText{display:none}
.stage{height:clamp(260px,42vh,360px)}
.stage .bubble{position:absolute;top:38px;left:10px;right:10px;background:#fff;color:var(--ink);border-radius:20px;padding:10px 14px;font-size:18px;font-weight:800;line-height:1.55;text-align:center;box-shadow:0 6px 14px #0004;z-index:3;max-height:42%;overflow-y:auto;animation:pop .35s}
.stage .bubble b{color:#be185d;font-size:15px}
.stage .bubble.from-s b{color:#0369a1}
.stage .bubble::after{content:"";position:absolute;bottom:-14px;border:9px solid transparent;border-top:14px solid #fff}
.stage .bubble.from-m::after{left:22%}.stage .bubble.from-s::after{right:22%}
.stage .girl{position:absolute;bottom:-4px;width:36%;max-width:170px;z-index:2;filter:drop-shadow(0 6px 8px #0005)}
.stage .g-m{left:2px}.stage .g-s{right:2px}.stage .g-s .gsvg{transform:scaleX(-1)}
.stage .girl .gsvg{display:block;position:relative;inset:auto;width:100%;height:auto}
.stage .gname{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:10px}
.stage .g-m .gname{background:#be185d}.stage .g-s .gname{background:#0369a1}
.stage .pic{top:auto;bottom:16%;font-size:44px;z-index:1}
.stage .boss{left:50%;transform:translateX(-50%);bottom:12%;z-index:1}
.stage .speak{bottom:auto;top:6px;right:auto;left:calc(50% - 21px);width:34px;height:34px;font-size:16px}
.stage .react{position:absolute;bottom:44%;background:#fff;color:var(--ink);border-radius:14px;padding:4px 10px;font-size:14px;font-weight:800;z-index:3;box-shadow:0 3px 8px #0004;animation:pop .3s;white-space:nowrap}
#react_m{left:8%}#react_s{right:8%}
.stage .react.big{font-size:15px;background:#fef9c3}
.talk{transform-box:fill-box;transform-origin:center;animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.1)}}
.gsvg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.stage.happy .girl{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-12px)}}
/* الرئيسية */
.hAv{display:flex;align-items:flex-end;justify-content:center;gap:4px;animation:none}
.hAv .hg{width:118px}.hAv .hg.flip .gsvg{transform:scaleX(-1)}
.hAv .hg .gsvg{animation:bob 2.6s ease-in-out infinite}.hAv .hg.flip .gsvg{animation:bobf 2.6s ease-in-out .6s infinite}
@keyframes bobf{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-10px)}}
.hAv .hme{margin-bottom:18px;animation:bob 2.4s ease-in-out infinite}
.hsub{font-size:15px;opacity:.85;margin-top:-6px;background:#ffffff1f;padding:4px 14px;border-radius:14px}
.gradeflag{position:absolute;transform:translate(-50%,-50%);background:#fff;color:#4c1d95;font-weight:900;font-size:14px;padding:6px 10px;border-radius:12px;box-shadow:0 4px 10px #0005;z-index:3;white-space:nowrap}

/* ===== الإصدار 4: الصف، النقاط، المكافآت ===== */
.gradebtn{background:#ffffff26;color:#fff;font-weight:800;font-size:16px;padding:8px 16px;border-radius:16px;margin-top:-6px}
.gcard{display:flex;flex-direction:column;align-items:center;width:100%;background:#f5f3ff;border:3px solid #ddd6fe;border-radius:20px;padding:12px;margin:8px 0;color:var(--ink);font-family:inherit}
.gcard.on{border-color:#22c55e;background:#dcfce7}.gcard .gem{font-size:40px}.gcard b{font-size:22px}.gcard small{font-size:14px;opacity:.75}
.gpick{display:flex;justify-content:center;gap:0;margin-bottom:-6px}.gpick svg{width:96px;height:auto}.gpick svg:last-child{transform:scaleX(-1)}

.ucard .uic{font-size:34px}.ucard b{font-size:13px}.ucard small{font-size:11px;font-weight:800;color:#6366f1}.ucard .uen{direction:ltr;color:#94a3b8}

.ear{font-size:26px;font-weight:900;margin-top:8px;color:#0f172a}
.eok{position:absolute;top:12px;left:14px;font-size:14px;font-weight:800;color:#16a34a}

/* ===== أنشطة جديدة v10 ===== */
#act{background:linear-gradient(160deg,#4c1d95,#7c3aed 55%,#db2777)}
.actbody{flex:1;overflow-y:auto;padding:8px 12px 30px;-webkit-overflow-scrolling:touch}
#actTitle{flex:1;text-align:center;font-weight:900}
.ibtn.new{background:linear-gradient(135deg,#f59e0b,#ec4899);position:relative}
.ibtn.new::after{content:"جديد";position:absolute;top:-6px;left:-4px;background:#22c55e;color:#fff;font-size:9px;font-weight:900;padding:1px 5px;border-radius:8px}
.hubs{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.hubs.one{grid-template-columns:1fr 1fr}
.hubc{display:grid;grid-template-columns:54px 1fr;grid-template-rows:auto auto;align-items:center;text-align:right;gap:0 10px;background:linear-gradient(135deg,#ede9fe,#fce7f3);color:#3b0764;border-radius:18px;padding:10px 12px;font-family:inherit;box-shadow:0 4px 0 #0002;animation:pop .35s both}
.hubc span{grid-row:1/3;font-size:40px}.hubc b{font-size:18px}.hubc small{opacity:.75;font-size:13px}
.hubs.one .hubc{grid-template-columns:1fr;text-align:center;justify-items:center}.hubs.one .hubc span{grid-row:auto}
.atalk{display:flex;align-items:flex-end;gap:6px;margin:4px 0 10px;min-height:110px}
.atg{width:90px;flex:none}.atg svg{width:100%;height:auto}.atg.flip svg{transform:scaleX(-1)}
.abub{flex:1;position:relative!important;inset:auto!important;transform:none!important;margin:0 0 14px!important;max-width:none!important;font-size:17px}
.pstep{background:#fff;color:#1e1b4b;border-radius:22px;padding:14px;text-align:center;position:relative;box-shadow:0 6px 0 #0003;animation:pop .4s both}
.pstep h2{margin:4px 0;color:#7c3aed}.pstep p{font-size:19px;line-height:1.7;margin:4px 0}
.pem{font-size:72px;animation:bob 2s ease-in-out infinite}
.pnum{position:absolute;top:10px;right:12px;background:#7c3aed;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px}
.pstep.dua .duat{font-size:24px;font-weight:900;color:#065f46;line-height:1.9}.pstep.dua small{opacity:.6}
.ordered{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ordok{background:#22c55e;color:#fff;border-radius:14px;padding:8px 12px;font-weight:800;animation:pop .3s}
.ordopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ordbtn{background:#fff;color:#3b0764;border-radius:16px;padding:10px 6px;font-family:inherit;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #0003}
.ordbtn span{font-size:30px}
.shake{animation:shake .4s}
.treebox{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 6px 0 #0003;max-width:420px;margin:0 auto}
.tree{display:block;width:100%;height:auto}.canopy{transform-origin:150px 270px;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.fruit{animation:bob 2.4s ease-in-out infinite}
.tstage{position:absolute;top:8px;right:8px;background:#fffd;color:#166534;border-radius:12px;padding:3px 10px;font-weight:900}

.mmo.ok{background:#22c55e;color:#fff}.mmo.bad{background:#ef4444;color:#fff;animation:shake .35s}
/* تلوين */

.colthumb svg{width:100%;height:auto;pointer-events:none}
.colwrap{background:#fff;border-radius:18px;padding:6px;max-width:400px;margin:0 auto}
.colsvg{display:block;width:100%;height:auto}.colwrap .colsvg>*{cursor:pointer}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0}
.pcol{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 0 #0003}
.pcol.on{transform:scale(1.2);border-color:#111;box-shadow:0 0 0 3px #facc15}
/* خط */
.tsec{margin:10px 0 6px;text-align:center}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}.tgrid.ltr{direction:ltr}
.tlet{background:#fff;color:#4c1d95;border-radius:12px;font-size:28px;font-weight:900;padding:4px 0;font-family:inherit;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #0003}
.tlet small{font-size:10px;color:#f59e0b;min-height:12px}.tlet.on{background:#fef3c7}
.trwrap{position:relative;width:min(88vw,360px);aspect-ratio:1;margin:0 auto 10px;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 #0003}
.trwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* الرتب وصندوق الأسبوع */
.hrow{display:flex;justify-content:center;margin:2px 0 4px}
.rankchip{--rc:#aaa;font-family:inherit;font-weight:900;font-size:15px;color:#fff;background:#0004;border:2px solid var(--rc);border-radius:20px;padding:4px 12px;display:flex;align-items:center;gap:6px}
.rbar{display:inline-block;width:60px;height:8px;background:#fff3;border-radius:6px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--rc)}
.rankframe .avatar,.rankframe>*{filter:drop-shadow(0 0 6px var(--rc))}
.ranks{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.rrow{--rc:#aaa;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#f1f5f9;opacity:.55}
.rrow span{font-size:26px}.rrow b{flex:1;text-align:right}.rrow.on{opacity:1;border-right:6px solid var(--rc)}.rrow.me{background:#fef9c3;box-shadow:0 0 0 2px var(--rc)}
.weekbar{width:100%;font-family:inherit;font-weight:900;font-size:16px;color:#fff;background:#0003;border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px;justify-content:center}
.weekbar small{opacity:.85}.weekbar.ready{background:linear-gradient(135deg,#f59e0b,#ef4444);animation:bob 1.4s ease-in-out infinite}
.wdots{display:flex;gap:4px}.wdots i{width:12px;height:12px;border-radius:50%;background:#fff4}.wdots i.on{background:#facc15}

</style>

<!-- الرئيسية -->

  const r=rng(g*100003+n*7919),qs=[GPOOL[g][(n-1)*2],GPOOL[g][(n-1)*2+1]].map(x=>({...x}));
  const t=mathTier(g,n);let m,sq,tries=0;

  tries=0;do{sq=seqQ(n+tries*5,r,Math.min(5,t+(g===3?0:1)));tries++}while(seen.has(sq.q)&&tries<50);seen.add(sq.q);

function fxBirds(n,col){let h="";for(let i=0;i<n;i++){const y=20+((i*37)%60),d=14+i*5;h+=`<g class="bird" style="animation-duration:${d}s;animation-delay:-${(i*7)%d}s"><g transform="translate(0,${y}) scale(${.8+(i%2)*.4})"><path class="flap" d="M0,0 q5,-6 10,0 q5,-6 10,0" stroke="${col||"#334155"}" stroke-width="2.2" fill="none" stroke-linecap="round"/></g></g>`}return h}
function fxPetals(n,cols){let h="";for(let i=0;i<n;i++){const x=(i*61)%400,d=6+(i%4)*2;h+=`<g class="petal" style="animation-duration:${d}s;animation-delay:-${(i*1.7)%d}s"><ellipse cx="${x}" cy="-10" rx="4" ry="2.5" fill="${cols[i%cols.length]}"/></g>`}return h}
function fxDust(n){let h="";for(let i=0;i<n;i++){const x=(i*53+20)%400,d=5+(i%3)*2;h+=`<circle class="dust" cx="${x}" cy="${150+(i*17)%40}" r="${1+i%2}" fill="#fff8dc" style="animation-duration:${d}s;animation-delay:-${(i*1.3)%d}s"/>`}return h}
function fxFloat(chars,col){return chars.map((c,i)=>`<text class="floatc" x="${30+i*(340/chars.length)}" y="${60+(i%3)*40}" font-size="${18+(i%2)*8}" fill="${col}" style="animation-delay:-${i*.8}s" font-weight="900">${c}</text>`).join("")}
function sceneFX(s){
 switch(s){
  case "general":return fxBirds(3)+fxPetals(10,["#f9a8d4","#fde047","#fff"]);
  case "desert":return fxBirds(2,"#7c2d12")+`<g class="heat"><rect y="150" width="400" height="50" fill="#fff" opacity=".05"/></g>`;
  case "geo":return fxBirds(3)+`<text class="jump" x="140" y="175" font-size="22">🐟</text><text class="jump j2" x="250" y="185" font-size="18">🐠</text>`;
  case "deen":return`<line class="shoot" x1="0" y1="0" x2="40" y2="14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>`+fxDust(6).replace(/fill="#fff8dc"/g,'fill="#fde047"');
  case "masjidIn":return fxDust(12);
  case "courtyard":return fxBirds(3)+fxPetals(6,["#fff","#bae6fd"]);
  case "library":return fxDust(10);
  case "history":return fxBirds(2,"#3b1530")+`<circle class="glow" cx="200" cy="140" r="58" fill="#fde68a" opacity=".25"/>`;
  case "arabic":return fxFloat(["أ","ب","ت","ث","ج"],"#c2410c55");
  case "math":return fxFloat(["+","×","÷","=","٪"],"#ffffff40");
  case "iq":return fxFloat(["؟","💡","؟"],"#fde04799");
  case "classroom":return fxFloat(["A","b","1","✏️"],"#ffffff55");
  default:return fxPetals(6,["#fff","#fde047"]);
 }
}

}
function place(i){if(cur.locked)return;const q=cur.qs[cur.i],k=cur.slots.indexOf(null);if(k<0)return;
 cur.slots[k]=i;$("tile"+i).classList.add("used");$("tile"+i).disabled=true;sfx.click();drawSlots();

  if(word===q.a){document.querySelectorAll(".slot").forEach(s=>s.classList.add("ok"));$("slots").insertAdjacentHTML("afterend",`<div class="wordok">${q.a}</div>`);resolve(cur.mist===0)}

function spellWords(g){return SPELL[g].split(",").map(s=>{const m=s.match(/^(\p{Extended_Pictographic}(?:‍\p{Extended_Pictographic}|️)*)(.+)$/u);return m?[m[1],m[2]]:["🔊",s]})}
function openSpell(){sfx.click();const g=gradeOf();S.spell=S.spell||{};const st=S.spell[g]=S.spell[g]||{i:0,ok:0};const W=spellWords(g),order=shuffle(W.map((_,k)=>k),rng(g*999+7));

function spellCur(){return SP.W[SP.order[SP.st.i%SP.W.length]]}

 drawTyped();drawKeys();setTimeout(()=>say(w[1],true),400)}

 $("spKeys").innerHTML=k(KEYS)+k(KEYS2)+k(KEYS3)+`<div class="krow">${KEYS4.map(c=>`<button class="key" onclick="spType('${c}')">${c==="ـّ"?"ـّ":c}</button>`).join("")}<button class="key wide" onclick="spDel()">⌫ مسح</button></div>

 words.forEach((w,k)=>{const picOk=w.pic!=="📅",spellOk=/^[a-z]{2,8}$/.test(w.en);const kinds=[...(picOk?["L","P"]:[]),"E","A",...(spellOk?["S"]:[])];const t=kinds[(k+ri(r,0,9))%kinds.length];

  else qs.push({...base,type:"letters",q:"رتّب الحروف لتكتب الكلمة بالإنجليزية 🔤",a:w.en,tiles:shuffle([...w.en],r),pic:w.pic,ltr:true,audio:w.en})});

 {id:"mosque",t:"المسجد",ic:"🕌",r:["M0,0H300V230H0Z","M0,230H300V300H0Z","M95,150Q95,80 150,70Q205,80 205,150Z","M80,150H220V240H80Z","M135,240V200Q150,180 165,200V240Z","M98,192V172Q108,158 118,172V192Z","M182,192V172Q192,158 202,172V192Z","M40,240V110H62V240Z","M36,110L51,78L66,110Z","M238,240V110H260V240Z","M234,110L249,78L264,110Z","M146,40a14,14 0 1,0 12,26a11,11 0 1,1 -12,-26Z",STAR(40,40,12),STAR(270,40,10),STAR(200,30,8)]},
 {id:"lantern",t:"الفانوس",ic:"🏮",r:["M0,0H300V300H0Z",CIRC(150,28,12),"M110,62H190L170,42H130Z","M120,70H180L190,200H110Z","M88,70H120L110,200H82Z","M180,70H212L218,200H190Z","M78,200H222L202,232H98Z","M128,232H172L150,262Z","M150,110Q134,140 150,165Q166,140 150,110Z",STAR(50,60,14),STAR(250,70,12),STAR(60,250,10),STAR(245,245,12)]},
 {id:"fish",t:"السمكة",ic:"🐠",r:["M0,0H300V300H0Z","M0,250Q150,228 300,250V300H0Z","M60,150Q150,70 220,150Q150,230 60,150Z","M215,150L270,108L258,150L270,192Z","M118,106Q150,66 182,100Z","M128,194Q150,226 172,197Z","M140,95Q128,150 140,205L156,203Q146,150 157,97Z",CIRC(95,140,10),CIRC(60,80,9),CIRC(80,50,6),CIRC(45,40,4),"M28,250Q16,210 34,176Q46,210 42,250Z","M262,250Q252,214 268,190Q280,218 276,250Z"]},
 {id:"flower",t:"الزهرة",ic:"🌻",r:["M0,0H300V300H0Z",...[0,60,120,180,240,300].map(a=>{const x=150+Math.cos(a*Math.PI/180)*40,y=105+Math.sin(a*Math.PI/180)*40;return{e:[x,y,26,16,a]}}),CIRC(150,105,24),"M146,135H154V250H146Z","M150,212Q108,188 98,214Q124,232 150,217Z","M150,190Q192,166 202,192Q176,210 150,195Z","M103,245H197L185,295H115Z",CIRC(40,40,22)]},
 {id:"house",t:"البيت",ic:"🏡",r:["M0,0H300V240H0Z","M0,240H300V300H0Z",CIRC(250,45,24),"M40,70a18,18 0 0,1 30,-12a20,20 0 0,1 36,4a16,16 0 0,1 4,30H44a16,16 0 0,1 -4,-22Z","M190,108V68H212V126Z","M70,150H230V262H70Z","M55,152L150,72L245,152Z","M133,262V202H167V262Z","M85,170H121V206H85Z","M179,170H215V206H179Z",CIRC(36,175,28),"M30,200H42V262H30Z"]}];
const PALETTE=["#ef4444","#f97316","#facc15","#22c55e","#14b8a6","#3b82f6","#6366f1","#a855f7","#ec4899","#92400e","#fde68a","#bae6fd","#86efac","#ffffff","#111827"];
let CL=null;
function regionSVG(r,i,fill,click){const ev=click?`onclick="colorRegion(${i})"`:"";const st=`fill="${fill}" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"`;
 if(typeof r==="string")return`<path d="${r}" ${st} ${ev}/>`;const e=r.e;return`<ellipse cx="${e[0]}" cy="${e[1]}" rx="${e[2]}" ry="${e[3]}" transform="rotate(${e[4]} ${e[0]} ${e[1]})" ${st} ${ev}/>`}
function drawingSVG(d,fills,click){return`<svg viewBox="0 0 300 300" class="colsvg" xmlns="http://www.w3.org/2000/svg">${d.r.map((r,i)=>regionSVG(r,i,fills[i]||"#ffffff",click)).join("")}</svg>`}
function openColoring(){S.colors=S.colors||{};openAct("🖍️ دفتر التلوين");
 $("actBody").innerHTML=girlTalk("m","happy")+`<div class="puzlist">${DRAWINGS.map((d,i)=>`<button class="colthumb" onclick="startColor(${i})">${drawingSVG(d,S.colors[d.id]||{},false)}<b>${d.ic} ${d.t}</b></button>`).join("")}</div>`;talkType("اختر رسمة ولوّنها بالألوان التي تحبها 🎨")}
function startColor(i){const d=DRAWINGS[i];S.colors=S.colors||{};S.colors[d.id]=S.colors[d.id]||{};CL={i,d,col:CL?CL.col:"#ef4444"};openAct("🖍️ "+d.t);drawColor()}
function drawColor(){const {d}=CL;$("actBody").innerHTML=`<div class="colwrap">${drawingSVG(d,S.colors[d.id],true)}</div>
 <div class="palette">${PALETTE.map(c=>`<button class="pcol ${CL.col===c?"on":""}" style="background:${c}" onclick="CL.col='${c}';drawColor()"></button>`).join("")}</div>
 <div class="row"><button class="bigbtn alt" onclick="S.colors[CL.d.id]={};save();drawColor()">🧽 امسح</button><button class="bigbtn green" onclick="saveColoring()">💾 حفظ الصورة</button><button class="bigbtn alt" onclick="openColoring()">الرسومات</button></div>`}
function colorRegion(i){S.colors[CL.d.id][i]=CL.col;beep(500+i*20,.04,"triangle",.05);save();
 const el=document.querySelectorAll("#actBody .colwrap svg > *")[i];if(el){el.setAttribute("fill",CL.col);el.animate&&el.animate([{opacity:.4},{opacity:1}],{duration:250})}
 const n=Object.keys(S.colors[CL.d.id]).length;if(n===CL.d.r.length&&!S.colors[CL.d.id].done){S.colors[CL.d.id].done=1;addCoins(15);save();confetti();sfx.win();toast("🎨 لوحة رائعة! +15 🪙");checkBadges()}}
function saveColoring(){const svg=drawingSVG(CL.d,S.colors[CL.d.id],false),img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=900;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,900,900);x.drawImage(img,0,0,900,900);
  x.font="bold 30px sans-serif";x.fillStyle="#7c3aed";x.textAlign="center";x.fillText(`رسم ${S.name||"البطل"} 🎨`,450,880);const url=c.toDataURL("image/png");
  if(window.Android&&Android.saveImage)Android.saveImage(url.split(",")[1],"تلوين_"+CL.d.t+".png");else{const a=document.createElement("a");a.href=url;a.download="تلوين_"+CL.d.t+".png";document.body.appendChild(a);a.click();a.remove()}};img.src=svgURL(svg)}

// ====== 8) تعلّم الخط (تتبّع الحروف) ======
const AR_LET=[..."أبتثجحخدذرزسشصضطظعغفقكلمنهوي"],EN_LET=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
let TR=null;
function openTrace(){S.trace=S.trace||{ar:{},en:{}};openAct("✍️ تعلّم الخط");
 const grid=(arr,lang)=>arr.map(l=>{const s=S.trace[lang][l]||0;return`<button class="tlet ${s?"on":""} ${lang}" onclick="startTrace('${lang}','${l}')">${l}<small>${s?"★".repeat(s):""}</small></button>`}).join("");
 $("actBody").innerHTML=girlTalk("s","happy")+`<h3 class="tsec">الحروف العربية</h3><div class="tgrid">${grid(AR_LET,"ar")}</div><h3 class="tsec">English Letters</h3><div class="tgrid ltr">${grid(EN_LET,"en")}</div>`;talkType("اختر حرفًا وتتبّعه بإصبعك فوق الخط المنقّط ✍️")}
function startTrace(lang,l){TR={lang,l};openAct(`✍️ الحرف ${l}`);
 $("actBody").innerHTML=`<p class="ctip">مرّر إصبعك فوق الحرف حتى تغطيه كله ✍️</p><div class="trwrap"><canvas id="trGuide"></canvas><canvas id="trDraw"></canvas></div>
 <div class="row"><button class="bigbtn alt" onclick="startTrace('${lang}','${l}')">🧽 امسح</button><button class="bigbtn alt" onclick="${lang==="en"?`sayEn('${l}')`:`say('${l}',true)`}">🔊</button><button class="bigbtn green" onclick="checkTrace()">✔ تحقّق</button></div><div id="trRes"></div>`;
 setTimeout(()=>{const g=$("trGuide"),d=$("trDraw"),w=g.clientWidth,dpr=window.devicePixelRatio||1;[g,d].forEach(c=>{c.width=w*dpr;c.height=w*dpr;c.getContext("2d").scale(dpr,dpr)});TR.w=w;
  const x=g.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,w);for(let i=1;i<4;i++){x.strokeStyle="#e5e7eb";x.beginPath();x.moveTo(0,w*i/4);x.lineTo(w,w*i/4);x.stroke()}
  x.font=`900 ${w*.72}px ${lang==="ar"?'"Noto Naskh Arabic","Noto Sans Arabic",serif':'"Comic Sans MS",sans-serif'}`;x.textAlign="center";x.textBaseline="middle";x.fillStyle="#e9d5ff";x.fillText(l,w/2,w*.52);x.setLineDash([8,8]);x.lineWidth=3;x.strokeStyle="#a855f7";x.strokeText(l,w/2,w*.52);
  const dc=d.getContext("2d");dc.lineCap="round";dc.lineJoin="round";dc.lineWidth=w*.07;dc.strokeStyle="#7c3aed";let on=false;
  const p=e=>{const r=d.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  d.onpointerdown=e=>{e.preventDefault();on=true;const[a,b]=p(e);dc.beginPath();dc.moveTo(a,b);dc.lineTo(a+.1,b);dc.stroke()};
  d.onpointermove=e=>{if(!on)return;const[a,b]=p(e);dc.lineTo(a,b);dc.stroke();if(Math.random()<.15)beep(300+Math.random()*200,.02,"sine",.02)};
  d.onpointerup=d.onpointerleave=()=>on=false;
  if(lang==="en")sayEn(l);else say(l,true)},60)}
function checkTrace(){const w=TR.w,dpr=window.devicePixelRatio||1,W=Math.round(w*dpr),m=document.createElement("canvas");m.width=m.height=W;const mx=m.getContext("2d");mx.scale(dpr,dpr);
 mx.font=`900 ${w*.72}px ${TR.lang==="ar"?'"Noto Naskh Arabic","Noto Sans Arabic",serif':'"Comic Sans MS",sans-serif'}`;mx.textAlign="center";mx.textBaseline="middle";mx.fillStyle="#000";mx.fillText(TR.l,w/2,w*.52);
 const big=document.createElement("canvas");big.width=big.height=W;const bx=big.getContext("2d");bx.scale(dpr,dpr);bx.font=mx.font;bx.textAlign="center";bx.textBaseline="middle";bx.fillText(TR.l,w/2,w*.52);bx.lineWidth=w*.09;bx.lineJoin="round";bx.strokeText(TR.l,w/2,w*.52);
 const L=mx.getImageData(0,0,W,W).data,B=bx.getImageData(0,0,W,W).data,D=$("trDraw").getContext("2d").getImageData(0,0,W,W).data;
 let lp=0,cov=0,dp=0,out=0;for(let i=3;i<L.length;i+=16){const inL=L[i]>100,inB=B[i]>100,dr=D[i]>100;if(inL){lp++;if(dr)cov++}if(dr){dp++;if(!inB)out++}}
 const c=lp?cov/lp:0,o=dp?out/dp:1,st=c>=.85&&o<.25?3:c>=.72&&o<.3?2:c>=.58&&o<.38?1:0;
 if(st){const old=S.trace[TR.lang][TR.l]||0;if(st>old)S.trace[TR.lang][TR.l]=st;addCoins(st*2);save();sfx.win();if(st===3)confetti();praise("ok")}else{sfx.bad()}
 $("trRes").innerHTML=`<div class="row"><p class="ctip">${st?"★".repeat(st)+"☆".repeat(3-st)+" أحسنت!":"حاول أن تغطي الحرف كله 💪"} (التغطية ${Math.round(c*100)}٪)</p></div>${st?`<div class="row"><button class="bigbtn green" onclick="traceNext()">الحرف التالي ◀</button><button class="bigbtn alt" onclick="openTrace()">كل الحروف</button></div>`:""}`;checkBadges()}
function traceNext(){const arr=TR.lang==="ar"?AR_LET:EN_LET,i=arr.indexOf(TR.l);startTrace(TR.lang,arr[(i+1)%arr.length])}

// ====== 9) الرتب ======
const RANKS=[[0,"🌱","مبتدئ","#a3a3a3"],[150,"📘","طالب مجتهد","#60a5fa"],[500,"⭐","نجم الصف","#facc15"],[1200,"🛡️","فارس المعرفة","#a855f7"],[2500,"🔬","عالم صغير","#22c55e"],[5000,"👑","بطل دار الوحي","#f59e0b"]];
function rankScore(){let st=0;Object.values(S.gs||{}).forEach(g=>Object.values(g.stars||{}).forEach(v=>st+=v));
 return(S.points||0)+st*5+(typeof engLearnedCount==="function"?engLearnedCount()*2:0)+((S.deeds&&S.deeds.total)||0)*2+Object.keys(S.stories||{}).length*20}
function rankIdx(sc){let i=0;RANKS.forEach((r,k)=>{if(sc>=r[0])i=k});return i}
function rankHTML(){const sc=rankScore(),i=rankIdx(sc),r=RANKS[i],nx=RANKS[i+1],pct=nx?Math.round((sc-r[0])/(nx[0]-r[0])*100):100;
 return`<button class="rankchip" style="--rc:${r[3]}" onclick="openRanks()">${r[1]} ${r[2]}<span class="rbar"><i style="width:${pct}%"></i></span></button>`}
function openRanks(){const sc=rankScore(),i=rankIdx(sc);sfx.click();
 modal(`<h2>🎖️ رتبتي</h2><p>نقاط الرتبة: <b>${sc}</b></p><div class="ranks">${RANKS.map((r,k)=>`<div class="rrow ${k<=i?"on":""} ${k===i?"me":""}" style="--rc:${r[3]}"><span>${r[1]}</span><b>${r[2]}</b><small>${r[0]}+</small></div>`).join("")}</div>
 <p style="font-size:13px;opacity:.7">تأتي نقاط الرتبة من: النقاط 🏆 + النجوم ⭐ + كلمات الإنجليزية + شجرة الحسنات + القصص</p><div class="row"><button class="bigbtn" onclick="closeModal()">إغلاق</button></div>`)}
function checkRankUp(){const i=rankIdx(rankScore());if(S.rankIdx===undefined){S.rankIdx=i;save();return}if(i>S.rankIdx){S.rankIdx=i;save();const r=RANKS[i];
 pushModal(()=>{modal(`<div class="badgebig">${r[1]}</div><h2>رتبة جديدة!</h2><p style="font-size:24px;font-weight:900;color:${r[3]}">${r[2]}</p><p>استمر يا بطل، الرتبة التالية بانتظارك!</p><div class="row"><button class="bigbtn green" onclick="closeModal()">رائع!</button></div>`);confetti();sfx.win();say("مبروك! رتبتك الآن "+r[2])});runQueue()}}

// ====== 10) صندوق الأسبوع ======
function weekId(){const d=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);return Math.floor((d-2)/7)}
function weekState(){const id=weekId();if(!S.week||S.week.id!==id)S.week={id,days:{},claimed:false};return S.week}
function markPlayDay(){const w=weekState(),t=todayStr();if(!w.days[t]){w.days[t]=1;save()}}
function weekHTML(){const w=weekState(),n=Object.keys(w.days).length,ready=n>=5&&!w.claimed;
 return`<button class="weekbar ${ready?"ready":""}" onclick="openWeekChest()">${w.claimed?"📭":"🎁"} صندوق الأسبوع <span class="wdots">${[0,1,2,3,4].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</span><small>${w.claimed?"فُتح ✅":ready?"افتحه الآن!":`${Math.min(n,5)}/5 أيام`}</small></button>`}
function openWeekChest(){const w=weekState(),n=Object.keys(w.days).length;sfx.click();
 if(w.claimed){modal(`<div style="font-size:60px">📭</div><h2>فتحت صندوق هذا الأسبوع</h2><p>يعود صندوق جديد يوم السبت 🎁</p><div class="row"><button class="bigbtn" onclick="closeModal()">حسنًا</button></div>`);return}
 if(n<5){modal(`<div style="font-size:60px">🎁</div><h2>صندوق الأسبوع</h2><p>العب ${5-n} ${5-n===1?"يومًا آخر":"أيام أخرى"} هذا الأسبوع لتفتحه!<br><small>(يُحتسب اليوم عندما تجيب عن سؤال واحد على الأقل)</small></p><div class="row"><button class="bigbtn" onclick="closeModal()">حسنًا</button></div>`);return}
 modal(`<h2>🎁 صندوق الأسبوع!</h2><p>لعبت 5 أيام هذا الأسبوع، أحسنت! اضغط لفتحه</p><div class="chest" id="wchest" onclick="crackWeek()">🎁</div><div id="wloot"></div>`,true)}
function crackWeek(){const c=$("wchest");if(c.dataset.open)return;c.dataset.open=1;c.classList.add("shakebig");
 setTimeout(()=>{modalLock=false;const w=weekState();w.claimed=true;addCoins(150);S.free=S.free||{};["hint","fifty","skip"].forEach(k=>S.free[k]=(S.free[k]||0)+1);save();c.textContent="✨";sfx.win();confetti();
  $("wloot").innerHTML=`<p style="font-size:22px;font-weight:900">🪙 +150<br>💡 ✂️ ⏭️ مساعدات مجانية</p><div class="row"><button class="bigbtn green" onclick="closeModal()">رائع!</button></div>`;say("رائع! ربحت 150 عملة ومساعدات مجانية")},900)}

// ====== أوسمة ======
BADGES.push(["deeds30","🌳","الشجرة المثمرة","سجّل 30 حسنة",()=>((S.deeds&&S.deeds.total)||0)>=30],
 ["puz5","🧩","حلّال الألغاز","أكمل 5 ألغاز صور",()=>Object.keys(S.puz||{}).length>=5],
 ["art3","🎨","الفنان","لوّن 3 رسومات كاملة",()=>Object.values(S.colors||{}).filter(x=>x&&x.done).length>=3],
 ["trace10","✍️","الخطّاط","أتقن 10 حروف",()=>Object.values((S.trace||{}).ar||{}).concat(Object.values((S.trace||{}).en||{})).filter(v=>v>0).length>=10]);

// ====== ربط الشاشة الرئيسية ======
function actHome(){if(MM&&MM.iv)clearInterval(MM.iv);show("home")}
function finishDua(){const st=starsFor(cur.right);S.duaBest=Math.max(S.duaBest||0,cur.right);save();
 $("rTitle").textContent=st?(st===3?"🤲 ما شاء الله! حافظ ممتاز":"🤲 أحسنت!"):"🤲 راجع الأدعية وحاول مجددًا";
 $("rAvatar").innerHTML=`<span style="font-size:64px">🤲</span>`;
 $("rInfo").innerHTML=`✅ الصحيحة: <b>${cur.right} من ${QN()}</b><br>🏆 النقاط: <b>${cur.pts>=0?"+":""}${cur.pts}</b><br>🪙 +${cur.earned}`;
 $("rNext").style.display="";$("rNext").textContent="🤲 الأدعية";$("rRetry").style.display="";$("rMap").textContent="🏠 الرئيسية";
 showResultStars(st);if(st){sfx.win();praise("win");if(st===3)confetti()}else{sfx.lose();praise("lose")}setTimeout(()=>{checkBadges();runQueue()},1500)}
const _rh2=refreshHome2;
refreshHome2=function(){_rh2();const r=$("hRank"),w=$("hWeek");if(r)r.innerHTML=rankHTML();if(w)w.innerHTML=weekHTML();
 const i=rankIdx(rankScore()),av=document.querySelector("#hAvatar .hme");if(av){av.style.setProperty("--rc",RANKS[i][3]);av.classList.add("rankframe")}
 setTimeout(checkRankUp,700)};

</script>
